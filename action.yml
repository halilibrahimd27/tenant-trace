name: "TenantTrace"
description: "Audit multi-tenant isolation: prove whether tenant A can reach tenant B's data."
author: "halilibrahimd27"

branding:
  icon: shield
  color: blue

inputs:
  config:
    description: "Path to tenanttrace.toml"
    required: false
    default: "tenanttrace.toml"
  base-url:
    description: "Override [target] base_url (useful when the app runs as a service container)"
    required: false
    default: ""
  fail-on:
    description: "Minimum severity that fails the check (critical|high|medium|low|none)"
    required: false
    default: "high"
  baseline:
    description: "Path to a baseline file of accepted findings"
    required: false
    default: ".tenanttrace-baseline.json"
  scan-path:
    description: "Source path for the static engine. Empty = skip the static pass."
    required: false
    default: ""
  allow-mutation:
    description: "Enable mutating attacks (mass-assignment / cross-tenant writes)"
    required: false
    default: "false"
  i-have-authorization:
    description: "Required for non-loopback targets. A statement you are making."
    required: false
    default: "false"
  comment-on-pr:
    description: "Post the finding summary as a PR comment"
    required: false
    default: "true"
  upload-artifacts:
    description: "Upload the run transcript as a workflow artifact"
    required: false
    default: "true"
  version:
    description: "TenantTrace version to install (a PyPI specifier, or 'source' for this checkout)"
    required: false
    default: "source"

outputs:
  findings:
    description: "Path to the JSON findings file"
    value: ${{ steps.probe.outputs.findings }}
  confirmed-count:
    description: "Number of dynamically confirmed findings"
    value: ${{ steps.probe.outputs.confirmed-count }}
  status:
    description: "VALID | INVALID (INVALID = the audit could not be trusted)"
    value: ${{ steps.probe.outputs.status }}
  exit-code:
    description: "0 clean · 1 findings gated · 2 usage error · 3 run INVALID"
    value: ${{ steps.probe.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install TenantTrace
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "source" ]; then
          python -m pip install --quiet "${{ github.action_path }}"
        else
          python -m pip install --quiet "tenanttrace${{ inputs.version }}"
        fi
        tenanttrace version

    - name: Validate configuration
      shell: bash
      run: tenanttrace validate-config --config "${{ inputs.config }}"

    - name: Static scan
      if: inputs.scan-path != ''
      shell: bash
      # Hypotheses only — this step never fails the build on its own (rule 3).
      run: tenanttrace scan --path "${{ inputs.scan-path }}" --config "${{ inputs.config }}" || true

    - name: Probe
      id: probe
      shell: bash
      run: |
        set +e
        args=(--config "${{ inputs.config }}" --fail-on "${{ inputs.fail-on }}")
        [ -n "${{ inputs.base-url }}" ] && args+=(--base-url "${{ inputs.base-url }}")
        [ -n "${{ inputs.baseline }}" ] && [ -f "${{ inputs.baseline }}" ] && args+=(--baseline "${{ inputs.baseline }}")
        [ "${{ inputs.allow-mutation }}" = "true" ] && args+=(--allow-mutation)
        [ "${{ inputs.i-have-authorization }}" = "true" ] && args+=(--i-have-authorization)

        tenanttrace probe "${args[@]}" | tee /tmp/tenanttrace-probe.log
        code=${PIPESTATUS[0]}
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        report=$(find . -path '*/.tenanttrace/runs/*/report.json' -print 2>/dev/null | sort | tail -1)
        echo "findings=$report" >> "$GITHUB_OUTPUT"

        if [ -n "$report" ]; then
          # A one-liner, not a heredoc: the previous version indented its `PY`
          # terminator, which `<<'PY'` never matches, so the block ran away.
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); c=[f for f in d.get("findings",[]) if f.get("confidence")=="confirmed"]; print("confirmed-count=%d" % len(c)); print("status=%s" % ("VALID" if d.get("status")=="valid" else "INVALID"))' "$report" >> "$GITHUB_OUTPUT"
        else
          echo "confirmed-count=0" >> "$GITHUB_OUTPUT"
          echo "status=INVALID" >> "$GITHUB_OUTPUT"
        fi
        exit 0

    - name: Job summary
      if: always()
      shell: bash
      # `tenanttrace summary` deliberately omits response bodies. A job summary
      # is readable by anyone who can see the run, and on a real target those
      # bodies are another tenant's data.
      run: |
        if [ -n "${{ steps.probe.outputs.findings }}" ]; then
          tenanttrace summary --run "${{ steps.probe.outputs.findings }}" >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "### TenantTrace"
            echo
            echo "No report was produced — see the workflow log."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on the pull request
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        report="${{ steps.probe.outputs.findings }}"
        [ -z "$report" ] && exit 0
        tenanttrace summary --run "$report" > /tmp/tenanttrace-comment.md
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file /tmp/tenanttrace-comment.md --edit-last --create-if-none \
          || gh pr comment "${{ github.event.pull_request.number }}" \
               --body-file /tmp/tenanttrace-comment.md

    - name: Upload run artifacts
      if: always() && inputs.upload-artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: tenanttrace-run
        path: .tenanttrace/
        retention-days: 7
        if-no-files-found: ignore

    - name: Gate
      shell: bash
      run: |
        code="${{ steps.probe.outputs.exit-code }}"
        case "$code" in
          0) echo "✅ no findings at or above ${{ inputs.fail-on }}" ;;
          1) echo "::error::TenantTrace found confirmed cross-tenant findings at or above ${{ inputs.fail-on }}" ;;
          2) echo "::error::TenantTrace configuration error — see the log" ;;
          3) echo "::error::TenantTrace run INVALID — the audit did not happen. This is NOT a clean result; see the job summary for why." ;;
          *) echo "::error::TenantTrace exited with $code" ;;
        esac
        exit "$code"
